name: Publish Packages

on:
  push:
    branches: [ "main" ]
    paths:
    - 'src/**'
    - '.github/workflows/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liquidsnow
          POSTGRES_PASSWORD: liquidsnow
          POSTGRES_DB: liquidsnow_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v3
   
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build packages
      run: dotnet build --no-restore
    
    - name: Run tests
      run: dotnet test --no-build
      env:
        LIQUIDSNOW_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=liquidsnow_tests;Username=liquidsnow;Password=liquidsnow

      #PUBLISH
    - name: Publish to Nuget
      run: dotnet nuget push "./build/*.nupkg" -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Publish to GitHub
      run: dotnet nuget push "./build/*.nupkg" -k ${{secrets.GITHUB_TOKEN}} -s https://nuget.pkg.github.com/ocluse/index.json --skip-duplicate
